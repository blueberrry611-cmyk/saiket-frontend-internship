<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task 6 - Landing Page</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:#1a1a2e}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 6%;background:#fff;position:sticky;top:0;box-shadow:0 1px 6px rgba(0,0,0,.08)}
nav b{font-size:1.3rem}
nav a{margin-left:20px;text-decoration:none;color:#1a1a2e}
.hero{padding:90px 6%;background:linear-gradient(135deg,#3b4cca,#7b5cf0);color:#fff;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);margin:0 0 12px}
.hero button,form button{padding:12px 26px;border:0;border-radius:8px;background:#ffb703;color:#000;font-size:1rem;cursor:pointer;margin-top:18px}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:60px 6%}
.features div{padding:22px;border:1px solid #e3e6f0;border-radius:10px}
#signup{padding:50px 6%;background:#f4f5fb;text-align:center}
form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input{padding:12px;border:1px solid #ccd;border-radius:8px;min-width:240px}
form button{margin-top:0}
#status{margin-top:14px;font-weight:bold}
footer{text-align:center;padding:20px;background:#1a1a2e;color:#ccc}
</style>
</head>
<body>
<nav><b>FlowTask</b><div><a href="#features">Features</a><a href="#signup">Sign up</a></div></nav>
<section class="hero">
  <h1>Plan your day without the chaos</h1>
  <p>FlowTask keeps your tasks, notes and deadlines in one simple place.</p>
  <button id="cta">Get started</button>
</section>
<section class="features" id="features">
  <div><h3>Simple lists</h3><p>Capture tasks in seconds.</p></div>
  <div><h3>Smart reminders</h3><p>Never miss a deadline again.</p></div>
  <div><h3>Works everywhere</h3><p>Phone, tablet or desktop.</p></div>
</section>
<section id="signup">
  <h2>Join the waitlist</h2>
  <form id="f"><input id="email" type="email" placeholder="you@example.com" aria-label="Email address"><button type="submit">Join</button></form>
  <p id="status" role="status"></p>
</section>
<footer>&copy; 2026 FlowTask</footer>
<script>
document.getElementById("cta").onclick=()=>{document.getElementById("signup").scrollIntoView({behavior:"smooth"});document.getElementById("email").focus()};
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  const v=document.getElementById("email").value.trim(),s=document.getElementById("status");
  if(/^\S+@\S+\.\S+$/.test(v)){s.style.color="#2a7a4b";s.textContent="Thanks! You're on the list.";e.target.reset()}
  else{s.style.color="#c0392b";s.textContent="Enter a valid email address."}
});
</script>
</body>
</html>
